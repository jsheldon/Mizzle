name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Mizzle.slnx --configuration Release

      - name: Pack (smoke)
        run: dotnet pack Mizzle.slnx --configuration Release -o packages
