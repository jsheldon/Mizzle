name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the Environment field of the nuget.org Trusted Publishing policy.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Mizzle.slnx --configuration Release

      - name: Pack
        run: >
          dotnet pack Mizzle.slnx --configuration Release -o packages
          -p:PackageVersion=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      # Exchanges the workflow's OIDC token for a 1-hour NuGet API key,
      # validated against the Trusted Publishing policy on nuget.org.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
